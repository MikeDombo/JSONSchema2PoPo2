name: Python package

on:
  push:
    branches:
      - master
  pull_request:
    branches: '*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # just test the earliest and latest Python versions that GitHub still provides builds for
        # (the newest runner image only has 3.10+, so the earliest one runs on ubuntu-24.04)
        include:
          - python-version: "3.8"
            os: ubuntu-24.04
          - python-version: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 12.x
        uses: actions/setup-node@v5
        with:
          node-version: 12.x
      - name: Use GoLang
        uses: actions/setup-go@v6
        with:
          go-version: '^1.13.1'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade wheel
          pip install mypy jsbeautifier
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Check format
        if: matrix.python-version == '3.14'
        run: |
          pip install black==26.5.1
          black --check .
      - name: Test with unittest
        run: |
          python -m unittest
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade build twine
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Build
      run: python -m build
    - name: Publish
      if: github.event_name == 'push'
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: twine upload dist/*
      continue-on-error: true
